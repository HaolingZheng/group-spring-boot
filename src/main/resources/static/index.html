<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Our group's Spring Boot application.">
  <title>Group Project | Spring Boot</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f4; color: #172e25; font: 18px/1.6 system-ui, sans-serif; padding: 24px; }
    main { width: 100%; max-width: 720px; padding: clamp(28px, 6vw, 64px); border: 1px solid #dae4dc; border-radius: 20px; background: white; box-shadow: 0 20px 60px #172e250a; }
    .label { color: #38764e; text-transform: uppercase; font-size: 12px; font-weight: 750; letter-spacing: .15em; }
    h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.12; letter-spacing: -.045em; margin: 20px 0; }
    p { color: #52665b; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { padding: 12px 20px; border-radius: 8px; color: white; background: #236840; text-decoration: none; font-size: 15px; font-weight: 650; }
    a.secondary { background: #edf4ee; color: #236840; }
    a:hover { filter: brightness(.92); }
    a:focus-visible { outline: 3px solid #87ac49; outline-offset: 4px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e6ece7; font-size: 13px; color: #6b7f72; }
  </style>
</head>
<body>
  <main>
    <span class="label">Our group project</span>
    <h1>Small beginnings.<br>Built together.</h1>
    <p>Welcome to our Spring Boot app. This is the starting point for our group's project.</p>
    <nav aria-label="Application endpoints">
      <a href="/api/hello">Try the API</a>
      <a class="secondary" href="/actuator/health">Check app health</a>
    </nav>
    <footer>Java &middot; Spring Boot &middot; GitHub &middot; Render</footer>
  </main>
</body>
</html>
